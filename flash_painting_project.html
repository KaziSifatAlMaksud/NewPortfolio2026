<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study — Kazi Sifat Al Maksud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1115;
    --panel:#161920;
    --panel-2:#1C202A;
    --text:#ECE9E2;
    --muted:#888C97;
    --line:#262A33;
    --accent:#3D5AFE;
    --accent-soft:#B9C2FF;
    --tag:#96A87E;
    --radius:18px;
    --ease:cubic-bezier(.22,1,.36,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent);color:#fff;}
  .display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}

  /* ---------- ambient background animation ---------- */
  .bg-ambient{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    pointer-events:none;
  }
  .bg-ambient .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    mix-blend-mode:screen;
    will-change:transform;
  }
  .bg-ambient .b1{
    width:560px;height:560px;
    top:-12%;left:-10%;
    background:radial-gradient(circle at 30% 30%, var(--accent), transparent 70%);
    opacity:.4;
    animation:drift1 24s var(--ease) infinite alternate;
  }
  .bg-ambient .b2{
    width:480px;height:480px;
    bottom:-18%;right:-8%;
    background:radial-gradient(circle at 60% 40%, var(--accent-soft), transparent 70%);
    opacity:.28;
    animation:drift2 30s var(--ease) infinite alternate;
  }
  .bg-ambient .b3{
    width:420px;height:420px;
    top:38%;left:52%;
    background:radial-gradient(circle at 50% 50%, var(--tag), transparent 70%);
    opacity:.16;
    animation:drift3 36s var(--ease) infinite alternate;
  }
  .bg-ambient::after{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(circle at 50% 0%, transparent 0%, var(--bg) 78%);
  }
  @keyframes drift1{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(90px,70px) scale(1.2); }
  }
  @keyframes drift2{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(-70px,-60px) scale(1.15); }
  }
  @keyframes drift3{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(-50px,60px) scale(1.1); }
  }
  @media (prefers-reduced-motion:reduce){
    .bg-ambient .blob{ animation:none; }
  }

  .wrap{
    width:100%;
    max-width:1640px;
    margin:0 auto;
    padding:0 40px;
  }
  @media (max-width:700px){ .wrap{padding:0 22px;} }

  .fade-item{
    opacity:0;
    transform:translateY(16px);
    animation:fadeInUp .7s var(--ease) forwards;
  }
  .fade-item:nth-of-type(1){animation-delay:.1s;}
  .fade-item:nth-of-type(2){animation-delay:.2s;}
  @keyframes fadeInUp{ to{ opacity:1; transform:translateY(0);} }

  /* ---------- nav ---------- */
  nav{
    position:fixed;top:0;left:0;right:0;
    z-index:60;
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 40px;
    backdrop-filter:blur(10px);
    background:linear-gradient(to bottom, rgba(15,17,21,.85), rgba(15,17,21,0));
  }
  @media (max-width:700px){ nav{padding:20px 22px;} }
  .mark{ font-size:18px; font-weight:700; letter-spacing:-.01em; }
  .mark span{ color:var(--accent); }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 18px;
    transition:border-color .3s var(--ease), color .3s var(--ease);
  }
  .back-link:hover{ border-color:var(--accent); color:var(--accent-soft); }

  /* ---------- hero ---------- */
  .p-hero{
    height:56vh;
    min-height:360px;
    margin-top:0;
    position:relative;
    overflow:hidden;
  }
  .p-hero .art{ position:absolute; inset:-8%; }
  .p-hero::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(to top, var(--bg), transparent 55%);
  }

  .glass-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(236,233,226,.16);
    backdrop-filter:blur(10px) saturate(140%);
    -webkit-backdrop-filter:blur(10px) saturate(140%);
    border-radius:999px;
    padding:6px 13px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--accent-soft);
    position:absolute;
    top:110px;left:40px;
    z-index:2;
  }
  @media (max-width:700px){ .glass-label{ left:22px; top:100px; } }

  /* ---------- header ---------- */
  .cs-header{
    padding:34px 0 30px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:20px;
  }
  .cs-header h1{
    font-size:clamp(30px,4.4vw,54px);
    font-weight:600;
    letter-spacing:-.02em;
  }
  .cs-meta{ display:flex; gap:14px; flex-wrap:wrap; }
  .cs-meta div{ font-size:13px; }
  .cs-meta .label{
    font-family:'IBM Plex Mono',monospace;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(236,233,226,.14);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:var(--tag);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:8px;
    padding:5px 11px;
    border-radius:999px;
    display:inline-block;
  }

  /* ---------- body ---------- */
  .cs-body{
    padding:46px 0 60px;
    display:grid;
    grid-template-columns:1.1fr 1.6fr;
    gap:60px;
  }
  @media (max-width:820px){ .cs-body{grid-template-columns:1fr; gap:30px;} }
  .cs-body p{
    color:var(--muted);
    line-height:1.85;
    font-size:16px;
    margin-bottom:18px;
  }
  .cs-gallery{ display:grid; gap:18px; }
  .cs-gallery .art-block{
    border-radius:14px;
    height:260px;
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .cs-gallery .art-block .art{ position:absolute; inset:-8%; }

  /* ---------- next project ---------- */
  .next-project{
    border-top:1px solid var(--line);
    padding:56px 0 90px;
  }
  .next-project .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:18px;
  }
  .next-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:30px 34px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    transition:border-color .35s var(--ease), transform .35s var(--ease);
  }
  .next-card:hover{ border-color:var(--accent); transform:translateY(-3px); }
  .next-card h3{
    font-size:clamp(22px,3vw,34px);
    font-weight:600;
    letter-spacing:-.02em;
  }
  .next-card .arrow{
    flex:0 0 auto;
    width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:1px solid var(--line);
    font-size:18px;
    transition:transform .35s var(--ease), background .35s var(--ease), border-color .35s var(--ease);
  }
  .next-card:hover .arrow{ transform:translate(4px,-4px); background:var(--accent); border-color:var(--accent); }

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:44px 0 46px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:18px;
  }
  footer .contact-link{
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px 22px;
    font-size:14px;
    transition:border-color .3s var(--ease), color .3s var(--ease);
  }
  footer .contact-link:hover{ border-color:var(--accent); color:var(--accent-soft); }
  footer small{ color:var(--muted); font-size:12px; }
</style>
</head>
<body>

<div class="bg-ambient" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<nav>
  <div class="mark">KS AL MAKSUD<span>.</span></div>
  <a class="back-link" href="index.html">← Back to work</a>
</nav>

<div class="p-hero">
  <div class="art" id="pHero"></div>
  <span class="glass-label" id="pBadge"></span>
</div>

<div class="wrap">
  <div class="cs-header fade-item">
    <h1 class="display" id="pTitle"></h1>
    <div class="cs-meta mono">
      <div><span class="label">Role</span><span id="pRole"></span></div>
      <div><span class="label">Year</span><span id="pYear"></span></div>
      <div><span class="label">Category</span><span id="pCat"></span></div>
    </div>
  </div>

  <div class="cs-body">
    <div class="fade-item" id="pText"></div>
    <div class="cs-gallery fade-item">
      <div class="art-block"><div class="art" id="pGal1"></div></div>
      <div class="art-block"><div class="art" id="pGal2"></div></div>
    </div>
  </div>
  
  <div class="flot-container fade-item" style="width: 100%;">
      <!-- <div class="flot" id="pFlot" style="width: 100%;"></div> -->
      <img src="flash_painting/1.png" style="width: 100%; height: auto;">
      <img src="flash_painting/2.png" style="width: 100%; height: auto;">
      <img src="flash_painting/3.png" style="width: 100%; height: auto;">
  </div>

  <div class="next-project">
    <div class="eyebrow mono">Next project</div>
    <a class="next-card" id="nextCard" href="#">
      <h3 class="display" id="nextTitle"></h3>
      <span class="arrow">↗</span>
    </a>
  </div>
</div>

<footer class="wrap">
  <a class="contact-link mono" href="mailto:kazi.sifat2013@gmail.com">kazi.sifat2013@gmail.com ↗</a>
  <small class="mono">© 2026 — Kazi Sifat Al Maksud</small>
</footer>

<script>
const projects = [
  {
    title:"Kite — Banking for freelancers",
    role:"Lead Product Designer",
    year:"2025",
    image:"images/kite.jpg",
    cat:"Product Design",
    grad:"linear-gradient(135deg,#1B2A6B,#3D5AFE 55%,#9AA9FF)",
    text:"Kite needed a banking app that felt honest about how freelance income actually works — irregular, tax-heavy, and hard to plan around. I led the product design from research through launch, rebuilding the account dashboard around cash-flow forecasting instead of a static balance. The result shipped to 40,000 users in its first quarter, with support tickets about tax withholding dropping by 61 percent."
  },
  {
    title:"Lumen Studio",
    role:"Brand Designer",
    year:"2025",
    cat:"Branding",
    grad:"linear-gradient(150deg,#3A2A16,#96A87E 60%,#D9E0C7)",
    text:"Lumen Studio, a lighting-design collective, wanted an identity that read as considered rather than decorative. I built a mark based on the way a single fixture throws shadow, paired with a restrained type system and a paper-stock print suite for their client presentations. The identity now anchors their site, signage, and studio space."
  },
  {
    title:"Wander",
    role:"Web Designer",
    year:"2024",
    cat:"Web Design",
    grad:"linear-gradient(150deg,#0D2130,#2C6E8F 55%,#8FD1E8)",
    text:"Wander's booking flow was losing almost half of users at the payment step. I redesigned the site around a single-page itinerary builder, cutting the checkout flow from seven steps to three and rewriting the copy to match how people actually describe trips. Conversion on mobile rose 34 percent within six weeks of launch."
  },
  {
    title:"Motionhouse Reel",
    role:"Motion Director",
    year:"2024",
    cat:"Motion",
    grad:"linear-gradient(150deg,#241226,#7A3D9B 55%,#C79BE0)",
    text:"A 90-second identity reel for a production house's new showreel, built around a single recurring shape that reforms into every client logo featured. I directed the animation system and typography choreography, keeping the palette to two tones so the client marks stayed the visual focus throughout."
  },
  {
    title:"Fable",
    role:"Product Designer",
    year:"2024",
    cat:"Product Design",
    grad:"linear-gradient(150deg,#331414,#B15A3E 55%,#EDB79B)",
    text:"Fable is a reading app for children aged 5 to 9. I designed the interaction model around large touch targets and audio-first navigation so pre-readers could use it independently, and built a parent dashboard that surfaces reading habits without turning them into a performance metric. Average session length grew from 6 to 19 minutes."
  },
  {
    title:"Northbound",
    role:"Brand Designer",
    year:"2023",
    cat:"Branding",
    grad:"linear-gradient(150deg,#12241A,#3E7A52 55%,#A9D8B8)",
    text:"Northbound makes technical outdoor gear for cold-weather hiking. The identity draws from topographic contour lines and gear labelling conventions, giving the brand a utilitarian voice that stands apart from the softer outdoor-lifestyle look most competitors share. The system now spans packaging, hangtags, and a print catalogue."
  }
];

const params = new URLSearchParams(window.location.search);
let id = parseInt(params.get('id'), 10);
if(isNaN(id) || id < 0 || id >= projects.length) id = 0;
const p = projects[id];
const nextId = (id + 1) % projects.length;
const np = projects[nextId];

document.title = p.title + " — Case Study";
document.getElementById('pHero').style.background = p.grad;
document.getElementById('pBadge').textContent = String(id+1).padStart(2,'0') + ' · ' + p.cat;
document.getElementById('pTitle').textContent = p.title;
document.getElementById('pRole').textContent = p.role;
document.getElementById('pYear').textContent = p.year;
document.getElementById('pCat').textContent = p.cat;
document.getElementById('pText').innerHTML = '<p>'+p.text+'</p>';
document.getElementById('pGal1').style.background = p.grad;
document.getElementById('pGal2').style.background = 'linear-gradient(60deg,'+p.grad.match(/#[0-9A-Fa-f]{6}/g).reverse().join(',')+')';
document.getElementById('nextCard').href = 'project.html?id='+nextId;
document.getElementById('nextTitle').textContent = np.title;
</script>

</body>
</html>
